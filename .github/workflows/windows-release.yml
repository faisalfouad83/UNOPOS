name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/unopos-pos-saas-flutter-ful666']
    paths-ignore: ['**.md', 'supabase/**', 'android/**']

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Build app
        run: |
          flutter pub get
          flutter build windows --release
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$d" build\windows\x64\runner\Release\ -ErrorAction SilentlyContinue
          }
      - name: Smoke test - start the app and print its log
        continue-on-error: true
        shell: pwsh
        run: |
          $app = Start-Process build\windows\x64\runner\Release\unopos.exe -PassThru
          Start-Sleep -Seconds 30
          $running = -not $app.HasExited
          Write-Host "App still running after 30s: $running"
          if ($running) { Stop-Process -Id $app.Id -Force }
          $log = Get-ChildItem $env:APPDATA -Recurse -Filter unopos.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Write-Host "---- $($log.FullName) ----"; Get-Content $log.FullName } else { Write-Host "No log file found" }
      - name: Build installer
        shell: pwsh
        run: |
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value)
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\unopos.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: UNOPOS-Windows
          path: |
            build/installer/*.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: UNOPOS-Windows-portable
          path: build/windows/x64/runner/Release/
          retention-days: 30
