name: Android release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/unopos-pos-saas-flutter-ful666']
    paths-ignore: ['**.md', 'supabase/**', 'windows/**', 'installer/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      # The signing key lives only in the repository's Actions secrets (this
      # repo is public). Without them the APK is signed with a throwaway
      # debug key: it installs, but can't update a build signed differently.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a debug key."
          fi
      - name: Build
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
          ver=$(grep -oP '^version:\s*\K[^+\s]+' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/UNOPOS-$ver.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/UNOPOS-$ver.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: UNOPOS-Android
          path: dist/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: UNOPOS-Android-PlayStore
          path: dist/*.aab
          retention-days: 30
